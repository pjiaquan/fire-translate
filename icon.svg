<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" /> <!-- Gray 900 -->
      <stop offset="100%" stop-color="#1f2937" /> <!-- Gray 800 -->
    </linearGradient>
    
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" /> <!-- Red 500 -->
      <stop offset="40%" stop-color="#f97316" /> <!-- Orange 500 -->
      <stop offset="80%" stop-color="#f59e0b" /> <!-- Amber 500 -->
      <stop offset="100%" stop-color="#fbbf24" /> <!-- Amber 400 -->
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#374151" stroke-width="12"/>
  
  <!-- Inner Flame Path (Detailed) -->
  <path d="M256,60 
           C256,60 380,180 380,300 
           C380,380 320,440 256,440 
           C192,440 132,380 132,300 
           C132,190 190,140 190,140 
           C190,140 160,200 160,280 
           C160,340 200,390 256,390 
           C312,390 330,340 330,290 
           C330,210 270,140 270,90 
           Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  
  <!-- Translation Symbol '文' stylized at the center of the flame in dark overlay or glow -->
  <path d="M230,240 L282,240 M256,225 L256,255 M235,260 C245,280 270,295 290,305 M277,260 C267,280 242,295 222,305" 
        stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>
